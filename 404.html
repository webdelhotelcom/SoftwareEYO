<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Software EYO</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1B2E; --orange:#F5A623;
    --background:#F6F8FC; --text:#101828; --text-secondary:#5A6472;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--background);color:var(--text);font-family:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px;}
  .box{max-width:440px;}
  h1{font-family:'Fraunces',Georgia,serif;color:var(--navy);font-size:2.2rem;margin:0 0 8px;}
  p{color:var(--text-secondary);line-height:1.6;margin:0 0 28px;}
  a.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:10px;}
  a.btn:hover{background:var(--orange);color:var(--navy);}
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>No encontramos esta página. Puede que el enlace esté roto o que la página se haya movido.</p>
    <a class="btn" href="/">← Volver al inicio</a>
  </div>
</body>
</html>
